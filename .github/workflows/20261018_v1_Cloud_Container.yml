name: Verify full cloud container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify the full application browser control logic
        run: node --test --test-reporter=spec tests/20261018_v1_Cloud_UI.test.mjs
      - name: Build actual source-derived application stores into the image
        run: docker build --build-arg BUILD_REVISION="$GITHUB_SHA" --tag connected-building-cloud:ci .
      - name: Exercise HTTP, SPARQL and real MQTT under free-host capacity limits
        run: python3 scripts/20261018_v1_Cloud_Smoke.py --image connected-building-cloud:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-cloud-container-capacity
          path: |
            reports/20261018_v1_Cloud_Container_Verification.json
            reports/20261018_v1_Cloud_Container_Logs.txt
          if-no-files-found: warn
