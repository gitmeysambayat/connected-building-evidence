name: Verify environmental sensor firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp32-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the pinned build tool
        run: python -m pip install platformio==6.1.18
      - name: Compile ESP32 device code with non-operational example settings
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python -m platformio run --project-dir firmware/20261018_v1_ESP32_SHT40 --environment compile_check --environment compile_full_check 2>&1 | tee reports/20261018_v1_Firmware_Build.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sensor-firmware-compilation-log
          path: reports/20261018_v1_Firmware_Build.txt
          if-no-files-found: warn
