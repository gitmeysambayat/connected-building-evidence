[platformio]
default_envs = compile_check

[env]
platform = espressif32@6.12.0
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SHT4x Library@1.0.5
    adafruit/Adafruit BusIO@1.17.2
    adafruit/Adafruit Unified Sensor@1.1.15
    bblanchon/ArduinoJson@6.21.5
lib_ignore =
    Adafruit SH110X
    Adafruit SSD1306
build_flags = -Wall -Wextra

[env:compile_check]
build_flags = ${env.build_flags} -DCONNECTED_BUILDING_COMPILE_CHECK=1

[env:compile_full_check]
build_flags = ${env.build_flags} -DCONNECTED_BUILDING_FULL_CHECK=1

[env:feather_esp32_v2]

